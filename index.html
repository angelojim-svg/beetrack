<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeTrack - Suivi des Courses de Trail</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

  <div class="max-w-7xl mx-auto space-y-6">
   
    <!-- En-tête -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-3xl font-bold text-amber-400">🐝 BeeTrack</h1>
        <p class="text-slate-400 text-sm">Suivi automatisé du calendrier et inscriptions de Trail</p>
      </div>
      <button onclick="loadRaces()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg transition">
        🔄 Rafraîchir
      </button>
    </header>

    <!-- Statistiques simples (KPIs) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-sm">Total Courses</span>
        <p id="kpi-total" class="text-2xl font-bold text-white">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-sm">Inscriptions Ouvertes</span>
        <p id="kpi-open" class="text-2xl font-bold text-emerald-400">0</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-sm">Ouverture Imminente</span>
        <p id="kpi-soon" class="text-2xl font-bold text-amber-400">0</p>
      </div>
    </div>

    <!-- Filtres -->
    <div class="flex flex-wrap gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
      <input type="text" id="search-input" oninput="filterRaces()" placeholder="Rechercher une course, ville..."
             class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-400 flex-1">
     
      <select id="status-filter" onchange="filterRaces()" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-400">
        <option value="ALL">Tous les statuts</option>
        <option value="Open">Ouvertes (Open)</option>
        <option value="Opening Soon">Bientôt ouvertes</option>
        <option value="TBD">À venir (TBD)</option>
      </select>
    </div>

    <!-- Tableau des résultats -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase">
          <tr>
            <th class="p-4">Course</th>
            <th class="p-4">Lieu</th>
            <th class="p-4">Distance / D+</th>
            <th class="p-4">Date Épreuve</th>
            <th class="p-4">Statut</th>
            <th class="p-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="races-table-body" class="divide-y divide-slate-700/50 text-sm">
          <tr>
            <td colspan="6" class="p-6 text-center text-slate-500">Chargement des données...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // Configuration Supabase (Clé anonyme publique)
    const SUPABASE_URL = "https://TON_PROJET.supabase.co";
    const SUPABASE_ANON_KEY = "TA_CLE_PUBLIQUE_ANON";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allRaces = [];

    async function loadRaces() {
      const { data, error } = await supabase
        .from('races')
        .select('*')
        .order('race_date', { ascending: true });

      if (error) {
        console.error("Erreur de chargement :", error);
        return;
      }

      allRaces = data || [];
      updateKPIs(allRaces);
      renderTable(allRaces);
    }

    function updateKPIs(races) {
      document.getElementById('kpi-total').textContent = races.length;
      document.getElementById('kpi-open').textContent = races.filter(r => r.status === 'Open').length;
      document.getElementById('kpi-soon').textContent = races.filter(r => r.status === 'Opening Soon').length;
    }

    function renderTable(races) {
      const tbody = document.getElementById('races-table-body');
      tbody.innerHTML = '';

      if (races.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">Aucune course trouvée.</td></tr>`;
        return;
      }

      races.forEach(race => {
        let badgeClass = 'bg-slate-700 text-slate-300';
        if (race.status === 'Open') badgeClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        if (race.status === 'Opening Soon') badgeClass = 'bg-amber-500/10 text-amber-400 border border-amber-500/20';

        const row = `
          <tr class="hover:bg-slate-700/30 transition">
            <td class="p-4 font-semibold text-white">${race.title}</td>
            <td class="p-4 text-slate-300">${race.location || 'N/C'}</td>
            <td class="p-4 text-slate-300">${race.distance} km / ${race.elevation}m D+</td>
            <td class="p-4 text-slate-300">${race.race_date}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-medium ${badgeClass}">
                ${race.status}
              </span>
            </td>
            <td class="p-4 text-right">
              ${race.organizer_url ? `<a href="${race.organizer_url}" target="_blank" class="text-amber-400 hover:underline">Voir Lien</a>` : '-'}
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function filterRaces() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const status = document.getElementById('status-filter').value;

      const filtered = allRaces.filter(race => {
        const matchesQuery = race.title.toLowerCase().includes(query) || race.location.toLowerCase().includes(query);
        const matchesStatus = status === 'ALL' || race.status === status;
        return matchesQuery && matchesStatus;
      });

      renderTable(filtered);
    }

    // Chargement initial
    // loadRaces();
  </script>
</body>
</html>
