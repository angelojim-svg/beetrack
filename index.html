<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeTrack - Suivi des Courses de Trail</title>
 
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS & JS de MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    #map {
      height: 450px;
      width: 100%;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

  <!-- EN-TÊTE / NAVBAR -->
  <header class="border-b border-gray-800 bg-gray-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl font-black bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
          🐝 BeeTrack
        </span>
        <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full font-medium">
          Dashboard
        </span>
      </div>
      <button onclick="loadRaces()" class="flex items-center space-x-2 bg-amber-500 hover:bg-amber-600 text-gray-950 font-semibold px-4 py-2 rounded-lg text-sm transition-colors shadow-lg shadow-amber-500/10">
        <span>🔄 Rafraîchir</span>
      </button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- CARTES DE KPI -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-5 shadow-sm">
        <div class="text-sm font-medium text-gray-400">Total Courses</div>
        <div id="total-courses" class="text-3xl font-extrabold text-white mt-1">0</div>
      </div>
      <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-5 shadow-sm">
        <div class="text-sm font-medium text-gray-400">Inscriptions Ouvertes</div>
        <div id="open-races" class="text-3xl font-extrabold text-emerald-400 mt-1">0</div>
      </div>
      <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-5 shadow-sm">
        <div class="text-sm font-medium text-gray-400">Ouverture Imminente</div>
        <div id="soon-races" class="text-3xl font-extrabold text-amber-400 mt-1">0</div>
      </div>
    </div>

    <!-- CARTE LEAFLET AVEC CLUSTERING -->
    <section class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-6 shadow-sm space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center space-x-2">
        <span>🗺️</span>
        <span>Carte des Événements</span>
      </h2>
      <div id="map"></div>
    </section>

    <!-- TABLEAU DES COURSES -->
    <section class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-6 shadow-sm space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <input type="text" id="search-input" onkeyup="filterRaces()" placeholder="Rechercher une course, une ville..."
               class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg focus:ring-amber-500 focus:border-amber-500 block w-full sm:w-80 p-2.5 placeholder-gray-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-gray-300">
          <thead class="text-xs uppercase bg-gray-900/60 text-gray-400 border-b border-gray-700">
            <tr>
              <th scope="col" class="px-4 py-3">Course</th>
              <th scope="col" class="px-4 py-3">Lieu</th>
              <th scope="col" class="px-4 py-3">Distance / D+</th>
              <th scope="col" class="px-4 py-3">Date d'ouverture</th>
              <th scope="col" class="px-4 py-3">Statut</th>
              <th scope="col" class="px-4 py-3">Action</th>
            </tr>
          </thead>
          <tbody id="races-table-body">
            <tr>
              <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                Chargement des données...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- SCRIPT JAVASCRIPT -->
  <script>
    // -------------------------------------------------------------
    // 1. CONFIGURATION SUPABASE
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://rjfykmedcxgasduebvbn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqZnlrbWVkY3hnYXNkdWVidmJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDI3NjEsImV4cCI6MjEwNjgxODc2MX0.4N9LkjjLno-z_o7NEGQjGdJDFXpzvBzRfzs-vRwv1GA";
   
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------------------------------------------------
    // 2. VARIABLES GLOBALES & INITIALISATION CARTE
    // -------------------------------------------------------------
    let map;
    let markersLayer;
    let allRaces = [];

    function initMap() {
      // Centrage initial sur la France
      map = L.map('map').setView([46.603354, 1.888334], 6);

      // Fond de carte OpenStreetMap standard
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Utilisation du MarkerCluster pour gérer les milliers de points sans ramer
      markersLayer = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 40
      });
      map.addLayer(markersLayer);
    }

    // -------------------------------------------------------------
    // 3. CHARGEMENT DES DONNÉES DEPUIS SUPABASE
    // -------------------------------------------------------------
    async function loadRaces() {
      try {
        const tbody = document.getElementById('races-table-body');
        tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">Chargement des données...</td></tr>`;

        const { data: races, error } = await supabaseClient
          .from('races')
          .select('*')
          .limit(10000);

        if (error) throw error;

        allRaces = races || [];

        // Vider la carte
        if (markersLayer) markersLayer.clearLayers();

        // Mettre à jour les KPI
        document.getElementById('total-courses').textContent = allRaces.length;
        const openCount = allRaces.filter(r => r.status === 'Open' || r.status === 'Ouvert' || r.status === 'Inscriptions Ouvertes').length;
        const soonCount = allRaces.filter(r => r.status === 'Opening Soon' || r.status === 'TBD' || r.status === 'Imminent').length;
       
        document.getElementById('open-races').textContent = openCount;
        document.getElementById('soon-races').textContent = soonCount;

        // Rendu
        renderRaces(allRaces);

      } catch (err) {
        console.error("Erreur Supabase :", err.message);
        document.getElementById('races-table-body').innerHTML = `
          <tr>
            <td colspan="6" class="px-4 py-8 text-center text-red-400">
              Impossible de charger les données. Vérifiez votre connexion.
            </td>
          </tr>`;
      }
    }

    // -------------------------------------------------------------
    // 4. RENDU DU TABLEAU ET DES MARQUEURS
    // -------------------------------------------------------------
    function renderRaces(races) {
      const tbody = document.getElementById('races-table-body');
      tbody.innerHTML = '';

      if (races.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">Aucune course trouvée.</td></tr>`;
        return;
      }

      if (markersLayer) markersLayer.clearLayers();

      races.forEach(race => {
        const title = race.title || 'Course sans nom';
        const location = race.location || 'N/A';
        const distance = race.distance || '-';
        const elevation = race.elevation || '-';
        const openingDate = race.opening_date ? new Date(race.opening_date).toLocaleDateString() : 'N/A';
        const status = race.status || 'TBD';
        const url = race.organizer_url || '#';

        // Ajout du marqueur sur la carte
        const lat = parseFloat(race.lat);
        const lng = parseFloat(race.lng);
        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0 && markersLayer) {
          const marker = L.marker([lat, lng]);
          marker.bindPopup(`<b>${title}</b><br>${location}<br><a href="${url}" target="_blank" style="color: #34d399; text-decoration: underline;">Lien organisateur</a>`);
          markersLayer.addLayer(marker);
        }

        // Ajout de la ligne dans le tableau
        const tr = document.createElement('tr');
        tr.className = 'border-b border-gray-800 hover:bg-gray-800/30 transition-colors';
        tr.innerHTML = `
          <td class="px-4 py-3 font-semibold text-white">${title}</td>
          <td class="px-4 py-3">${location}</td>
          <td class="px-4 py-3">${distance} km / +${elevation} m</td>
          <td class="px-4 py-3">${openingDate}</td>
          <td class="px-4 py-3">
            <span class="px-2.5 py-1 text-xs rounded-full font-medium ${
              status === 'Open' || status === 'Ouvert' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
            }">
              ${status}
            </span>
          </td>
          <td class="px-4 py-3">
            ${url !== '#' ? `<a href="${url}" target="_blank" class="text-emerald-400 hover:underline text-xs font-semibold">S'inscrire ↗</a>` : '<span class="text-gray-500 text-xs">N/C</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // -------------------------------------------------------------
    // 5. FILTRE DE RECHERCHE
    // -------------------------------------------------------------
    function filterRaces() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allRaces.filter(race =>
        (race.title && race.title.toLowerCase().includes(query)) ||
        (race.location && race.location.toLowerCase().includes(query))
      );
      renderRaces(filtered);
    }

    // -------------------------------------------------------------
    // 6. DÉMARRAGE AUTOMATIQUE
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadRaces();
    });
  </script>
</body>
</html>
